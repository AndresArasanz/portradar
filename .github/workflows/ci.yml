name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias de test
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Tests Python (recolector, validación de data/ y E2E)
        run: python -m pytest --cov=collector --cov-fail-under=80
      - name: Tests web
        run: npm test
